<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="refresh" content="0; url=https://starexx.vercel.app/" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="googlebot" content="noindex, nofollow" />
  <link rel="canonical" href="https://starexx.vercel.app/" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="src/global.css"/>
  <link rel="stylesheet" href="src/style.css"/>
  <body>
      
    <div class="header">
      <textarea class="search-textarea" id="searchTextarea" placeholder="Search"></textarea>
      <button class="dropdown-btn" id="filterDropdown">
        Filters
      </button>
    </div>
      
    <div class="main-content">
      <div id="searchResults" class="search-results-text"></div>
      <div class="grid" id="grid">
        <div class="loading"></div>
      </div>        
      <div class="footer">
        <button class="mode-tab active" id="modeTab">Items</button>
        <div class="footer-pill" id="pagePill">1/322</div>
      </div>
    </div>
      
    <div class="fade-bg" id="fadeBg"></div> 
    <div class="bottom-sheet" id="pageSheet">
      <div class="pages-grid" id="pagesGrid"></div>
    </div>
      
    <div class="bottom-sheet search-sheet" id="searchSheet">
      <div class="search-hint"></div>
    </div>
      
    <script src="src/script.js">
    </script>
  </body>
</html>
